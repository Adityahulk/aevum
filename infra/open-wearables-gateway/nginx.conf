server {
 listen ${PORT};
 listen [::]:${PORT};
 resolver ${DNS_RESOLVERS} valid=10s;
 set $upstream "${OPEN_WEARABLES_UPSTREAM}";
 client_max_body_size 20m;
 access_log off;
 location = /health { return 200 'ok'; }
 # OAuth initiation and administrative/read APIs stay private. SDK routes enforce user tokens upstream.
 location ~ ^/api/v1/(oauth/[a-z_]+/callback|sdk/.*|token/(refresh|revoke)|providers/[a-z_]+/webhooks.*|oura/webhooks.*|strava/webhooks.*)$ {
   proxy_pass $upstream;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 60s;
 }
 location ~ ^/api/v1/users/[0-9a-f-]+/connections/[a-z_]+$ {
   limit_except DELETE { deny all; }
   proxy_pass $upstream;
 }
 location / { return 404; }
}
