map $http_x_forwarded_proto $forwarded_scheme {
 default $scheme;
 https https;
}
server {
 listen ${PORT};
 listen [::]:${PORT};
 resolver ${DNS_RESOLVERS} valid=10s;
 resolver_timeout 5s;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 16m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  set $api_upstream "${API_UPSTREAM}";
  proxy_pass $api_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $forwarded_scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 60s;
 }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; }
}
