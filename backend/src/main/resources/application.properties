server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.runtime/aevum;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
server.servlet.session.cookie.http-only=true
spring.jackson.serialization.write-dates-as-timestamps=false
